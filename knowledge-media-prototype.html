<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونهٔ کتابخانه رسانه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap">
<style>
/* Layout concept: Channel-shaped app shell (library sidebar + workspace) with a Spotify-style bottom player bar, built only from the app's --md-sys-color tokens. */
:root{--md-sys-color-primary:#4e5f66;--md-sys-color-on-primary:#ffffff;--md-sys-color-primary-container:#d1e7ef;--md-sys-color-on-primary-container:#0a1e24;--md-sys-color-secondary:#535f70;--md-sys-color-tertiary:#6b5778;--md-sys-color-tertiary-container:#f2daff;--md-sys-color-on-tertiary-container:#251431;--md-sys-color-error:#ba1a1a;--md-sys-color-success:#10b981;--md-sys-color-warning:#f59e0b;--md-sys-color-background:#fdfcff;--md-sys-color-surface:#f9f9fc;--md-sys-color-on-surface:#1a1c1e;--md-sys-color-surface-variant:#e1e2ec;--md-sys-color-on-surface-variant:#44474f;--md-sys-color-outline-variant:#c4c6cf;--font:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--md-sys-color-primary:#b5cbd2;--md-sys-color-on-primary:#1f3238;--md-sys-color-primary-container:#37474d;--md-sys-color-on-primary-container:#d1e7ef;--md-sys-color-secondary:#bbc7db;--md-sys-color-tertiary:#d6bee4;--md-sys-color-tertiary-container:#523f5f;--md-sys-color-on-tertiary-container:#f2daff;--md-sys-color-error:#ffb4ab;--md-sys-color-success:#6ee7b7;--md-sys-color-warning:#fcd34d;--md-sys-color-background:#191c1d;--md-sys-color-surface:#101416;--md-sys-color-on-surface:#e1e3e4;--md-sys-color-surface-variant:#40484b;--md-sys-color-on-surface-variant:#bfc8cc;--md-sys-color-outline-variant:#40484b;color-scheme:dark}}
:root[data-theme="dark"]{--md-sys-color-primary:#b5cbd2;--md-sys-color-on-primary:#1f3238;--md-sys-color-primary-container:#37474d;--md-sys-color-on-primary-container:#d1e7ef;--md-sys-color-secondary:#bbc7db;--md-sys-color-tertiary:#d6bee4;--md-sys-color-tertiary-container:#523f5f;--md-sys-color-on-tertiary-container:#f2daff;--md-sys-color-error:#ffb4ab;--md-sys-color-success:#6ee7b7;--md-sys-color-warning:#fcd34d;--md-sys-color-background:#191c1d;--md-sys-color-surface:#101416;--md-sys-color-on-surface:#e1e3e4;--md-sys-color-surface-variant:#40484b;--md-sys-color-on-surface-variant:#bfc8cc;--md-sys-color-outline-variant:#40484b;color-scheme:dark}
body{background:var(--md-sys-color-background);color:var(--md-sys-color-on-surface);font-family:var(--font);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 auto 12px;max-width:1408px;font-size:12px}
.ctl .lbl{color:var(--md-sys-color-on-surface-variant);font-weight:700}
.ctl button,.ctl select{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--md-sys-color-outline-variant);background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font:inherit;font-weight:500}
.ctl button[aria-pressed="true"]{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);border-color:transparent}
.ctl .note{margin-inline-start:auto;color:var(--md-sys-color-on-surface-variant)}
.frame{margin:0 auto;max-width:1408px;transition:max-width .3s cubic-bezier(.2,0,0,1)}
.frame.phone{max-width:392px}

.proto{--p:var(--md-sys-color-primary);--op:var(--md-sys-color-on-primary);--pc:var(--md-sys-color-primary-container);--opc:var(--md-sys-color-on-primary-container);--s:var(--md-sys-color-surface);--os:var(--md-sys-color-on-surface);--sv:var(--md-sys-color-surface-variant);--osv:var(--md-sys-color-on-surface-variant);--ov:var(--md-sys-color-outline-variant);--bg:var(--md-sys-color-background);--t:var(--md-sys-color-tertiary);--tc:var(--md-sys-color-tertiary-container);--otc:var(--md-sys-color-on-tertiary-container);--ok:var(--md-sys-color-success);--wn:var(--md-sys-color-warning);--er:var(--md-sys-color-error);--sec:var(--md-sys-color-secondary);
--sl:color-mix(in srgb,var(--s) 75%,var(--sv) 25%);--sc:color-mix(in srgb,var(--s) 50%,var(--sv) 50%);--sh:color-mix(in srgb,var(--s) 25%,var(--sv) 75%);--hair:color-mix(in srgb,var(--ov) 30%,transparent);
direction:rtl;container-type:inline-size;height:780px;display:flex;flex-direction:column;background:var(--bg);color:var(--os);border:1px solid var(--hair);border-radius:20px;overflow:hidden;position:relative;font-size:14px;line-height:1.5}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-variation-settings:'FILL' 0;-webkit-font-smoothing:antialiased;font-size:20px}
.ms.f{font-variation-settings:'FILL' 1}
.proto :focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:8px}

.top{display:flex;align-items:center;gap:12px;padding:14px 24px 0;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:10px}
.ttl .tile{width:32px;height:32px;border-radius:10px;background:var(--p);color:var(--op);display:grid;place-items:center}
.ttl h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.cnt{font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--pc);color:var(--otc)}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--osv);transition:background .2s,color .2s,transform .2s}
.ib:hover{background:var(--pc);color:var(--opc)}.ib:active{transform:scale(.94)}
.top .sp{margin-inline-start:auto;display:flex;gap:4px}
.seg{display:flex;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--sv) 40%,transparent);border:1px solid var(--hair);width:fit-content;margin:12px 24px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg a{display:flex;align-items:center;gap:8px;padding:8px 22px;border-radius:12px;font-size:13px;font-weight:700;color:var(--osv);text-decoration:none;cursor:pointer;transition:all .3s}
.seg a:hover{color:var(--os);background:color-mix(in srgb,var(--sv) 60%,transparent)}
.seg a.on{background:var(--p);color:var(--op);box-shadow:0 4px 12px color-mix(in srgb,var(--p) 30%,transparent)}

.shell{flex:1;min-height:0;display:flex;border-top:1px solid var(--hair)}
.side{width:340px;flex:none;display:flex;flex-direction:column;background:var(--s);border-inline-end:1px solid var(--hair);transition:width .45s cubic-bezier(.2,0,0,1);overflow:hidden}
.side.col{width:76px}
.sh{padding:16px 16px 12px;flex:none}
.sh .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh .tile{width:32px;height:32px;border-radius:10px;background:var(--p);color:var(--op);display:grid;place-items:center;flex:none}
.sh h2{font-size:14px;font-weight:700;margin:0}.sh small{display:block;font-size:10px;color:color-mix(in srgb,var(--osv) 70%,transparent)}
.sh .sp{margin-inline-start:auto}
.search{position:relative}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--ov);background:var(--sl);color:var(--os);font:inherit;font-size:13px;padding:0 40px 0 12px;outline:0;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 18%,transparent)}
.search .ms{position:absolute;inset-inline-start:12px;top:10px;color:var(--osv);font-size:20px}
.pills{display:flex;gap:6px;padding:10px 16px;flex:none;overflow-x:auto;scrollbar-width:none;align-items:center;border-top:1px solid var(--hair)}
.pills button{padding:5px 11px;border-radius:8px;font-size:11px;font-weight:700;color:var(--osv);white-space:nowrap;transition:all .2s}
.pills button:hover{background:var(--sv)}.pills button.on{background:var(--pc);color:var(--opc)}
.list{flex:1;overflow-y:auto;padding:4px 8px 12px;scrollbar-width:thin}
.lbl2{font-size:10px;font-weight:700;color:var(--osv);padding:10px 10px 4px;letter-spacing:.04em}
.row{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .2s;position:relative;border-inline-start:2px solid transparent}
.row:hover{background:var(--sv)}
.row.on{background:color-mix(in srgb,var(--pc) 45%,transparent);border-inline-start-color:var(--p)}
.cov{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;position:relative;color:var(--os);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 58%,var(--s)),color-mix(in srgb,var(--c) 22%,var(--s)));box-shadow:0 0 0 1px var(--hair)}
.ri{min-width:0;flex:1}
.rt{margin:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row.on .rt{color:var(--p)}
.rm{margin:1px 0 0;font-size:11px;color:var(--osv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:3px;border-radius:3px;background:var(--sv);margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--p);border-radius:3px;transition:width .3s}
.pin{font-size:14px;color:var(--osv)}
.side.col .ri,.side.col .sh .hd h2,.side.col .sh small,.side.col .search,.side.col .pills,.side.col .lbl2,.side.col .sh .sp,.side.col .pin{display:none}
.side.col .row{justify-content:center;padding:8px 0}.side.col .sh{padding:12px 0;display:flex;justify-content:center}.side.col .sh .hd{margin:0}
.eq{position:absolute;inset:auto 0 5px 0;display:flex;gap:2px;justify-content:center;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--p);border-radius:2px;animation:eq 1s ease-in-out infinite;height:30%}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;position:relative}
.hero{--c:var(--p);padding:28px 28px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,var(--s)) 0%,var(--bg) 100%);display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.hcov{width:184px;height:184px;border-radius:20px;flex:none;display:grid;place-items:center;color:var(--os);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 62%,var(--s)),color-mix(in srgb,var(--c) 24%,var(--s)));box-shadow:0 16px 40px color-mix(in srgb,var(--c) 28%,transparent),0 0 0 1px var(--hair)}
.hcov .ms{font-size:76px;opacity:.9}
.hi{flex:1;min-width:240px}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;background:var(--pc);color:var(--opc)}
.chip.t{background:var(--tc);color:var(--otc)}.chip .ms{font-size:14px}
.hi h2{font-size:34px;line-height:1.25;font-weight:800;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.hi p.d{margin:0 0 12px;font-size:13px;color:var(--osv);max-width:64ch}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--osv);align-items:center}
.meta b{color:var(--os);font-weight:700}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 28px 4px}
.play{height:56px;min-width:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--p);color:var(--op);display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:14px;box-shadow:0 8px 22px color-mix(in srgb,var(--p) 35%,transparent);transition:transform .2s,box-shadow .2s}
.play:hover{transform:translateY(-1px);box-shadow:0 12px 28px color-mix(in srgb,var(--p) 42%,transparent)}.play:active{transform:scale(.97)}
.play .ms{font-size:30px}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--ov);display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--os);background:transparent;transition:all .2s}
.btn:hover{background:var(--pc);color:var(--opc);border-color:transparent}.btn.on{background:var(--pc);color:var(--opc);border-color:transparent}
.btn.ic{width:44px;padding:0;justify-content:center}
.ring{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--osv)}
.ring svg{display:block}.ring b{color:var(--os);display:block;font-size:13px}

.vstage{margin:16px 28px 0;aspect-ratio:16/9;max-height:360px;width:calc(100% - 56px);border-radius:20px;overflow:hidden;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 45%,var(--s)),color-mix(in srgb,var(--c) 14%,var(--s)));box-shadow:0 0 0 1px var(--hair)}
.vstage>.ms{font-size:96px;opacity:.35}
.vstage .scrim{position:absolute;inset:auto 0 0 0;padding:44px 16px 12px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);display:flex;flex-direction:column;gap:8px;color:#fff;opacity:0;transition:opacity .25s}
.vstage:hover .scrim,.vstage:focus-within .scrim,.vstage.paused .scrim{opacity:1}
.vstage .vbar{height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}.vstage .vbar i{display:block;height:100%;background:#fff;width:0}
.vstage .vrow{display:flex;align-items:center;gap:12px;font-size:12px}
.vstage .vrow button{color:#fff;display:grid;place-items:center;width:36px;height:36px;border-radius:10px}.vstage .vrow button:hover{background:rgba(255,255,255,.18)}
.vstage .big{position:absolute;inset:0;display:grid;place-items:center}
.vstage .big span{width:72px;height:72px;border-radius:22px;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;transition:transform .2s}
.vstage .big:hover span{transform:scale(1.06)}

.tabs{display:flex;gap:4px;padding:18px 28px 0;border-bottom:1px solid var(--hair);margin-top:8px;position:sticky;top:0;background:var(--bg);z-index:3}
.tabs button{padding:10px 16px;font-size:13px;font-weight:700;color:var(--osv);position:relative;border-radius:10px 10px 0 0;display:flex;gap:6px;align-items:center;transition:color .2s}
.tabs button:hover{color:var(--os)}.tabs button.on{color:var(--p)}
.tabs button.on::after{content:"";position:absolute;inset:auto 10px -1px 10px;height:3px;border-radius:3px;background:var(--p)}
.tabs .n{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--tc);color:var(--otc)}
.panel{padding:8px 20px 28px}
.thead,.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) 120px 100px 44px;gap:12px;align-items:center;padding:0 12px}
.thead{height:40px;font-size:11px;font-weight:700;color:var(--osv);border-bottom:1px solid var(--hair);letter-spacing:.03em}
.lrow{min-height:64px;border-radius:14px;cursor:pointer;transition:background .2s;position:relative}
.lrow:hover{background:var(--sv)}.lrow.on{background:color-mix(in srgb,var(--pc) 45%,transparent)}
.lrow.lk{opacity:.55;cursor:not-allowed}
.no{display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--osv);position:relative;height:32px}
.lrow:hover .no .num{display:none}.lrow:hover .no .hov{display:block}.no .hov{display:none}
.lt{min-width:0}.lt p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .a{font-size:14px;font-weight:700}.lt .b{font-size:12px;color:var(--osv)}
.lrow.on .lt .a{color:var(--p)}
.dur{font-size:12px;color:var(--osv);font-variant-numeric:tabular-nums}
.pg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--osv)}
.pg .tr{flex:1;height:4px;border-radius:4px;background:var(--sv);overflow:hidden}.pg .tr i{display:block;height:100%;background:var(--p);border-radius:4px;width:0}
.pg .dn{color:var(--ok)}.pg .lkt{white-space:nowrap}
.dl{color:var(--osv);justify-self:center}
.lw{display:flex;gap:12px;align-items:center}.lw .lx{min-width:0;flex:1}
.lic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--os);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 52%,var(--s)),color-mix(in srgb,var(--c) 20%,var(--s)));box-shadow:0 0 0 1px var(--hair)}
.lrow.on .lic{background:var(--p);color:var(--op)}
.scr{position:absolute;inset:0;background:color-mix(in srgb,var(--os) 42%,transparent);display:grid;place-items:center;z-index:30;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dlg{width:min(480px,100%);max-height:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--s);border-radius:20px;border:1px solid var(--hair);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dh{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 70%,var(--t)));color:var(--op)}
.dh h3{margin:0;font-size:15px;font-weight:800}.dh small{opacity:.85;font-size:11px;display:block}
.dh .ib{color:var(--op);margin-inline-start:auto}.dh .ib:hover{background:color-mix(in srgb,var(--op) 18%,transparent);color:var(--op)}
.db{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.fld{font-size:11px;font-weight:700;color:var(--osv)}
.sel{display:flex;gap:10px;align-items:center;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--p);background:var(--sl);font-size:13px;box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 14%,transparent)}
.sel .ms{color:var(--p)}.sel .sp{margin-inline-start:auto;color:var(--osv)}
.opts{overflow-y:auto;max-height:260px;border:1px solid var(--hair);border-radius:14px;padding:4px;background:var(--s)}
.opt{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;font-size:13px;text-align:start;color:var(--os)}
.opt:hover{background:var(--sv)}.opt.on{background:var(--pc);color:var(--opc);font-weight:700}
.opt .ms{font-size:20px;color:var(--osv)}.opt.on .ms{color:var(--p)}
.df{display:flex;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--hair);background:var(--sl)}
.df .pv{display:flex;gap:10px;align-items:center;flex:1;min-width:0;font-size:12px;color:var(--osv)}
.sample{margin:18px 12px 0;padding:12px 14px;border-radius:14px;background:var(--sl);border:1px dashed var(--ov);font-size:12px;color:var(--osv);display:flex;gap:10px;align-items:center}

.tx{display:flex;flex-direction:column;gap:4px;padding:8px 12px 0}
.tl{display:flex;gap:14px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .2s;font-size:15px;line-height:1.9;color:var(--osv)}
.tl:hover{background:var(--sv)}.tl .ts{font-size:11px;font-weight:700;color:var(--osv);padding-top:5px;min-width:42px;font-variant-numeric:tabular-nums}
.tl.on{background:color-mix(in srgb,var(--pc) 50%,transparent);color:var(--os);font-weight:600}.tl.on .ts{color:var(--p)}
.tl.past{color:var(--os);opacity:.7}
.notes{display:flex;flex-direction:column;gap:10px;padding:8px 12px 0}
.note{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sl);border:1px solid var(--hair)}
.note .tm{font-size:12px;font-weight:800;color:var(--p);min-width:44px;cursor:pointer;font-variant-numeric:tabular-nums}.note p{margin:0;font-size:13px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:12px}
.mat{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--s);border:1px solid var(--hair);box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:transform .2s,box-shadow .2s}
.mat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.mat .cov{width:44px;height:44px}.mat b{font-size:13px;display:block}.mat small{font-size:11px;color:var(--osv)}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:56px 20px;color:var(--osv);font-size:13px}.empty .ms{font-size:44px;opacity:.5}

 const i=s.id===S.sid?S.li:0;
 return `<div class="vstage${S.playing&&s.id===S.sid?'':' paused'}" id="vstage" style="--c:${ACC[s.c]}"><span class="ms f">${s.icon}</span><button class="big" type="button" data-act="playpause" aria-label="پخش یا توقف"><span><i class="ms f" style="font-size:38px;font-style:normal">${S.playing&&s.id===S.sid?'pause':'play_arrow'}</i></span></button><div class="scrim"><div class="vbar"><i id="vfill"></i></div><div class="vrow"><button type="button" data-act="prev" aria-label="قبلی"><span class="ms f">skip_previous</span></button><button type="button" data-act="playpause" aria-label="پخش"><span class="ms f">${S.playing&&s.id===S.sid?'pause':'play_arrow'}</span></button><button type="button" data-act="next" aria-label="بعدی"><span class="ms f">skip_next</span></button><span id="vtime">${fmt(P[s.id][i])} / ${fmt(s.ls[i].d)}</span><span style="margin-inline-start:auto">${s.ls[i].t}</span><button type="button" data-act="pip" aria-label="تصویر در تصویر"><span class="ms">picture_in_picture_alt</span></button><button type="button" data-act="full" aria-label="تمام‌صفحه"><span class="ms">fullscreen</span></button></div></div></div>`;
}

function lessonsHTML(s){
 const rows=s.ls.map((l,i)=>{const p=P[s.id][i],dn=p>=l.d-1,on=s.id===S.sid&&i===S.li,pl=on&&S.playing;
  const no=l.lock?'<span class="ms" style="font-size:18px">lock</span>':(pl?'<b class="eq" style="position:static;height:16px"><i></i><i></i><i></i></b>':(dn&&!on?'<span class="ms f" style="color:var(--ok);font-size:20px">check_circle</span>':`<span class="num">${fa(i+1)}</span><span class="ms f hov" style="font-size:22px;color:var(--p)">play_arrow</span>`));
  const pg=l.lock?`<span class="lkt"><span class="ms" style="font-size:14px;vertical-align:-3px">schedule</span> ${l.lock}</span>`:(dn?'<span class="dn">تمام‌شده</span>':`<div class="tr"><i style="width:${Math.round(p/l.d*100)}%"></i></div><span>${p>0?fa(Math.round(p/l.d*100))+'٪':''}</span>`);
  return `<div class="lrow${on?' on':''}${l.lock?' lk':''}" role="button" tabindex="0" data-act="lesson" data-id="${i}" data-rf="${s.id}-${i}"><div class="no">${no}</div><div class="lt lw"><span class="lic" style="--c:${ACC[s.c]}"><span class="ms f">${lic(s,i)}</span></span><div class="lx"><p class="a">${l.t}</p><p class="b">${l.topic}</p></div></div><div class="dur">${fmt(l.d)}</div><div class="pg" data-pg="${i}">${pg}</div><button type="button" class="dl ib" data-act="${S.edit?'ico':'dl'}" data-id="${i}" aria-label="${S.edit?'تغییر آیکون':'دانلود'}" title="${S.edit?'تغییر آیکون جلسه':'دانلود'}"><span class="ms">${S.edit?'edit':'download'}</span></button></div>`}).join('');
 return `<div class="thead"><span style="text-align:center">#</span><span>عنوان جلسه</span><span>مدت</span><span>پیشرفت</span><span></span></div>${rows}<div class="sample"><span class="ms">tips_and_updates</span>جلسه‌های قفل‌شده در تاریخ انتشار خودکار باز می‌شوند (انتشار تدریجی).</div>`;
}
function transcriptHTML(s){
 const k=s.id+':'+(s.id===S.sid?S.li:2);const tx=TX[k];
 if(!tx)return '<div class="empty"><span class="ms">subtitles_off</span>برای این جلسه هنوز رونوشت بارگذاری نشده است.<small>مدیر می‌تواند فایل زیرنویس (WebVTT) را در پنل مدیریت اضافه کند.</small></div>';
 return '<div class="tx">'+tx.map((r,i)=>`<div class="tl" data-act="seekto" data-id="${r[0]}" data-tl="${i}"><span class="ts">${fmt(r[0])}</span><span>${r[1]}</span></div>`).join('')+'</div>';
}
function notesHTML(){
 return `<div class="notes"><div style="display:flex;gap:8px"><button class="btn" type="button" data-act="addnote"><span class="ms">bookmark_add</span>افزودن یادداشت در ${fmt(S.t)}</button><button class="btn" type="button" data-act="share"><span class="ms">link</span>پیوند این لحظه</button></div>${S.notes.map(n=>`<div class="note"><span class="tm" data-act="seekto" data-id="${n[0]}">${fmt(n[0])}</span><p>${n[1]}</p></div>`).join('')}</div>`;
}
function matsHTML(){return '<div class="mats">'+MATS.map(m=>`<div class="mat" data-act="dl"><div class="cov" style="--c:${ACC[m[3]]}"><span class="ms f">${m[0]}</span></div><div><b>${m[1]}</b><small>${m[2]}</small></div></div>`).join('')+'</div>'}

function mainHTML(){
 const s=ser(S.view),p=pct(s),d=done(s),R=26,C=2*Math.PI*R;
 const ctx=s.id===S.sid;const resume=s.ls.findIndex((l,i)=>!l.lock&&P[s.id][i]<l.d-1);
 const rl=resume<0?0:resume,rp=P[s.id][rl];
 const tabs=[['lessons','جلسات','list',0],['transcript','رونوشت','subtitles',0],['notes','یادداشت‌ها','edit_note',S.notes.length],['mats','مواد همراه','folder_open',MATS.length]].map(([k,n,ic,c])=>`<button type="button" role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-act="tab" data-id="${k}"><span class="ms" style="font-size:18px">${ic}</span>${n}${c?`<span class="n">${fa(c)}</span>`:''}</button>`).join('');
 const body=S.tab==='lessons'?lessonsHTML(s):S.tab==='transcript'?transcriptHTML(s):S.tab==='notes'?notesHTML():matsHTML();
 return `<main class="main" id="mainpane"><div class="hero" style="--c:${ACC[s.c]}"><button class="ib back" type="button" data-act="back" aria-label="بازگشت" style="position:absolute;inset-block-start:14px;inset-inline-start:14px"><span class="ms">arrow_forward</span></button><div class="hcov"><span class="ms f">${s.icon}</span></div><div class="hi"><div class="eyebrow"><span class="chip"><span class="ms f">${s.kind==='video'?'smart_display':'headphones'}</span>${kindLbl(s)}</span><span class="chip t">${s.type}</span></div><h2>${s.title}</h2><p class="d">${s.desc}</p><div class="meta"><b>${s.unit}</b><span>·</span><span>${s.dept}</span><span>·</span><span>${s.date}</span><span>·</span><span>${meta(s)}</span></div></div></div>
 <div class="acts"><button class="play" type="button" data-act="hero"><span class="ms f">${ctx&&S.playing?'pause':'play_arrow'}</span>${ctx&&S.playing?'توقف':(d>0&&d<s.ls.length?'ادامه از جلسهٔ '+fa(rl+1)+' · '+fmt(rp):'پخش')}</button><button class="btn ic${S.saved[s.id]?' on':''}" type="button" data-act="save" aria-pressed="${!!S.saved[s.id]}" aria-label="نشان کردن" title="نشان کردن"><span class="ms ${S.saved[s.id]?'f':''}">bookmark</span></button><button class="btn" type="button" data-act="dl"><span class="ms">download</span>${s.ls.length>1?'دانلود همهٔ جلسه‌ها':'دانلود'}</button><button class="btn ic" type="button" data-act="share" aria-label="اشتراک‌گذاری" title="اشتراک‌گذاری"><span class="ms">share</span></button><button class="btn${S.edit?' on':''}" type="button" data-act="edit" aria-pressed="${S.edit}" title="پیش‌نمایش پنل مدیریت: انتخاب آیکون هر جلسه"><span class="ms">tune</span>آیکون جلسه‌ها (مدیر)</button>
 <div class="ring"><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--sv)" stroke-width="6"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="var(--p)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 32 32)"/></svg><div><b>${fa(d)} از ${fa(s.ls.length)} جلسه</b>${fa(Math.round(p*100))}٪ پیشرفت</div></div></div>
 ${stageHTML(s)}<div class="tabs" role="tablist">${tabs}</div><div class="panel" id="panel">${body}</div></main>`;
}

function barHTML(){
 const s=cur(),l=lsn();
 return `<footer class="np" aria-label="پخش‌کنندهٔ رسانه"><span class="mfill" id="mfill"></span><div class="nf"><div class="cov" style="--c:${ACC[s.c]}"><span class="ms f">${lic(s,S.li)}</span></div><div style="min-width:0"><b>${l.t}</b><small>${s.title}</small></div><button class="ib" type="button" data-act="save" aria-label="نشان کردن"><span class="ms ${S.saved[s.id]?'f':''}">favorite</span></button></div>
 <div class="nc"><div class="nb"><button class="ib" type="button" data-act="prev" aria-label="جلسهٔ قبل"><span class="ms f">skip_previous</span></button><button class="ib" type="button" data-act="back10" aria-label="۱۰ ثانیه عقب"><span class="ms">replay_10</span></button><button class="pp" type="button" data-act="playpause" id="ppbtn" aria-label="پخش یا توقف"><span class="ms f">${S.playing?'pause':'play_arrow'}</span></button><button class="ib" type="button" data-act="fwd10" aria-label="۱۰ ثانیه جلو"><span class="ms">forward_10</span></button><button class="ib" type="button" data-act="next" aria-label="جلسهٔ بعد"><span class="ms f">skip_next</span></button></div>
 <div class="sk"><span id="tcur">${fmt(S.t)}</span><div class="seek" id="seek" role="slider" tabindex="0" aria-label="جایگاه پخش" aria-valuemin="0" aria-valuemax="${l.d}" aria-valuenow="${Math.floor(S.t)}"><div class="trk"><div class="fl" id="sfill"></div>${(CH[s.id+':'+S.li]||[]).slice(1).map(c=>`<i class="chp" style="inset-inline-start:${c[0]/l.d*100}%"></i>`).join('')}</div><span class="bub" id="bub">0:00</span></div><span>${fmt(l.d)}</span></div></div>
 <div class="nr"><button class="spd" type="button" data-act="speed" aria-label="سرعت پخش" id="spd">${fa(S.speed)}×</button><button class="ib" type="button" data-act="mute" aria-label="صدا"><span class="ms" id="vic">${S.vol?'volume_up':'volume_off'}</span></button><input class="vol" type="range" min="0" max="1" step=".05" value="${S.vol}" id="vol" aria-label="بلندی صدا"><button class="ib${S.theatre?' on':''}" type="button" data-act="theatre" aria-pressed="${S.theatre}" aria-label="حالت سینمایی" title="حالت سینمایی (کم‌رنگ شدن بقیهٔ برنامه)"><span class="ms">${S.theatre?'close_fullscreen':'open_in_full'}</span></button></div></footer>`;
}

function dialogHTML(){
 if(!S.pick)return '';
 const s=ser(S.pick.sid),l=s.ls[S.pick.li],cu=lic(s,S.pick.li),q=S.iq.trim();
 const list=ICONS.filter(([n,b])=>!q||n.includes(q)||b.includes(q));
 const lab=(ICONS.find(x=>x[0]===cu)||[cu,cu])[1];
 return `<div class="scr" data-act="icobg"><div class="dlg" role="dialog" aria-modal="true" aria-label="انتخاب آیکون جلسه"><div class="dh"><span class="ms f" style="font-size:26px">admin_panel_settings</span><div><h3>پنل مدیریت · ویرایش جلسه</h3><small>${l.t}</small></div><button class="ib" type="button" data-act="icoclose" aria-label="بستن"><span class="ms">close</span></button></div><div class="db"><label class="fld" for="iq">آیکون</label><div class="sel"><span class="ms f">${cu}</span><span>${lab}</span><span class="ms sp">unfold_more</span></div><div class="search"><span class="ms">search</span><input id="iq" type="search" placeholder="جستجوی آیکون…" aria-label="جستجوی آیکون" value="${S.iq}"></div><div class="opts" role="listbox" aria-label="آیکون‌ها">${list.map(([n,b])=>`<button class="opt${n===cu?' on':''}" type="button" role="option" aria-selected="${n===cu}" data-act="icopick" data-id="${n}"><span class="ms f">${n}</span><span>${b}</span></button>`).join('')||'<div class="empty">آیکونی پیدا نشد</div>'}</div></div><div class="df"><div class="pv"><span class="lic" style="--c:${ACC[s.c]}"><span class="ms f">${cu}</span></span><span>پیش‌نمایش در فهرست جلسه‌ها و پخش‌کننده</span></div><button class="btn" type="button" data-act="icoreset">پیش‌فرض</button><button class="play" type="button" style="height:44px;border-radius:14px;font-size:13px;padding:0 18px" data-act="icoclose"><span class="ms f" style="font-size:20px">check</span>ذخیره</button></div></div></div>`;
}

function render(){
 app.dataset.pane=S.pane||app.dataset.pane;
 app.classList.toggle('theatre',S.theatre);
 app.innerHTML=`<div class="top"><div class="ttl"><div class="tile"><span class="ms f" style="font-size:18px">video_library</span></div><h1>کتابخانهٔ رسانه</h1></div><span class="cnt">${fa(SER.length)} سری و ویدیو</span><div class="sp"><button class="ib" type="button" aria-label="راهنمای نشانگر اعلان"><span class="ms">notifications</span></button><button class="ib" type="button" aria-label="راهنما"><span class="ms">help</span></button></div></div>
 <nav class="seg" aria-label="بخش‌های دانش سازمانی"><a data-act="reports"><span class="ms">show_chart</span>گزارشات</a><a class="on" aria-current="page"><span class="ms f">play_circle</span>رسانه</a></nav>
 <div class="shell">${sideHTML()}${mainHTML()}</div>${barHTML()}${dialogHTML()}<div class="toast" role="status" aria-live="polite"></div>`;
 bindInputs();tickUI();
}

function tickUI(){
 const s=cur(),l=lsn(),f=Math.min(1,S.t/l.d)*100;
 const sf=$('#sfill');if(sf)sf.style.width=f+'%';
 const mf=$('#mfill');if(mf)mf.style.width=f+'%';
 const tc=$('#tcur');if(tc)tc.textContent=fmt(S.t);
 const sk=$('#seek');if(sk)sk.setAttribute('aria-valuenow',Math.floor(S.t));
 const vf=$('#vfill');if(vf&&S.view===S.sid)vf.style.width=f+'%';
 const vt=$('#vtime');if(vt&&S.view===S.sid)vt.textContent=fmt(S.t)+' / '+fmt(l.d);
 if(S.view===S.sid){const pr=$(`[data-pg="${S.li}"]`);if(pr&&!l.lock){const dn=P[S.sid][S.li]>=l.d-1;pr.innerHTML=dn?'<span class="dn">تمام‌شده</span>':`<div class="tr"><i style="width:${Math.round(P[S.sid][S.li]/l.d*100)}%"></i></div><span>${P[S.sid][S.li]>0?fa(Math.round(P[S.sid][S.li]/l.d*100))+'٪':''}</span>`}}
 const tx=TX[S.sid+':'+S.li];if(tx&&S.tab==='transcript'&&S.view===S.sid){let a=0;tx.forEach((r,i)=>{if(S.t>=r[0])a=i});$$('.tl').forEach((e,i)=>{e.classList.toggle('on',i===a);e.classList.toggle('past',i<a)})}
}

function seekTo(t){const l=lsn();S.t=Math.max(0,Math.min(l.d,t));P[S.sid][S.li]=Math.max(P[S.sid][S.li],S.t);tickUI()}
function setPlaying(v){S.playing=v;$$('#ppbtn .ms').forEach(e=>e.textContent=v?'pause':'play_arrow');render()}
function playTo(sid,li){const s=ser(sid);if(s.ls[li].lock){toast('این جلسه در '+s.ls[li].lock+' منتشر می‌شود');return}S.sid=sid;S.li=li;S.t=P[sid][li]>=s.ls[li].d-1?0:P[sid][li];S.playing=true;if(S.t>0)toast('ادامه از '+fmt(S.t));render()}
function step(dir){const s=cur();let i=S.li+dir;while(i>=0&&i<s.ls.length&&s.ls[i].lock)i+=dir;if(i<0||i>=s.ls.length){S.playing=false;toast(dir>0?'پایان سری':'اولین جلسه است');render();return}S.li=i;S.t=0;if(dir>0)toast('جلسهٔ بعد: '+s.ls[i].t);render()}

setInterval(()=>{if(!S.playing)return;const l=lsn();S.t+=.25*S.speed;P[S.sid][S.li]=Math.max(P[S.sid][S.li],S.t);if(S.t>=l.d){P[S.sid][S.li]=l.d;step(1);return}tickUI()},250);

app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;
 const a=el.dataset.act,id=el.dataset.id;
 if(a==='pick'){S.view=id;S.tab='lessons';app.dataset.pane='main';render();const m=$('#mainpane');if(m)m.scrollTop=0}
 else if(a==='filter'){S.filter=id;render()}
 else if(a==='col'){S.col=!S.col;render()}
 else if(a==='back'){app.dataset.pane='list';render()}
 else if(a==='tab'){S.tab=id;render()}
 else if(a==='lesson'){const i=+id;if(S.view===S.sid&&i===S.li){setPlaying(!S.playing)}else playTo(S.view,i)}
 else if(a==='hero'){if(S.view===S.sid&&S.playing)setPlaying(false);else{const s=ser(S.view);const r=Math.max(0,s.ls.findIndex((l,i)=>!l.lock&&P[s.id][i]<l.d-1));if(S.view===S.sid&&!S.playing)setPlaying(true);else playTo(S.view,r)}}
 else if(a==='playpause'){setPlaying(!S.playing)}
 else if(a==='prev'){if(S.t>5){seekTo(0)}else step(-1)}
 else if(a==='next'){step(1)}
 else if(a==='back10'){seekTo(S.t-10)}
 else if(a==='fwd10'){seekTo(S.t+10)}
 else if(a==='speed'){const v=[1,1.25,1.5,2,.75];S.speed=v[(v.indexOf(S.speed)+1)%v.length];$('#spd').textContent=fa(S.speed)+'×'}
 else if(a==='mute'){S.vol=S.vol?0:.8;const v=$('#vol');v.value=S.vol;$('#vic').textContent=S.vol?'volume_up':'volume_off'}
 else if(a==='theatre'){S.theatre=!S.theatre;render()}
 else if(a==='seekto'){seekTo(+id)}
 else if(a==='save'){S.saved[S.view]=S.saved[S.view]?0:1;toast(S.saved[S.view]?'نشان شد':'نشان برداشته شد');render()}
 else if(a==='addnote'){S.notes.push([Math.floor(S.t),'یادداشت تازه در این لحظه']);toast('یادداشت اضافه شد');render()}
 else if(a==='share'){toast('پیوند لحظهٔ '+fmt(S.t)+' کپی شد (نمونه)')}
 else if(a==='dl'){toast('در برنامهٔ واقعی، فایل دانلود می‌شود')}
 else if(a==='edit'){S.edit=!S.edit;render();toast(S.edit?'حالت مدیر: روی مداد هر جلسه بزنید':'حالت مدیر خاموش شد')}
 else if(a==='ico'){S.pick={sid:S.view,li:+id};S.iq='';render()}
 else if(a==='icobg'){if(e.target===el){S.pick=null;render()}}
 else if(a==='icoclose'){S.pick=null;render();toast('آیکون جلسه ذخیره شد (نمونه)')}
 else if(a==='icopick'){S.ic[S.pick.sid+':'+S.pick.li]=id;render()}
 else if(a==='icoreset'){delete S.ic[S.pick.sid+':'+S.pick.li];render()}
 else if(a==='reports'){toast('به تب گزارشات می‌رود (پیوند صفحه‌به‌صفحه)')}
 else if(a==='pip'||a==='full'){toast('در برنامهٔ واقعی برای ویدیو فعال است')}
});
function bindInputs(){
 const q=$('#q');if(q)q.addEventListener('input',()=>{S.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)});
 const iq=$('#iq');if(iq)iq.addEventListener('input',()=>{S.iq=iq.value;const pos=iq.selectionStart;render();const n=$('#iq');n.focus();n.setSelectionRange(pos,pos)});
 const v=$('#vol');if(v)v.addEventListener('input',()=>{S.vol=+v.value;$('#vic').textContent=S.vol?'volume_up':'volume_off'});
 const sk=$('#seek');if(sk){const at=ev=>{const r=sk.getBoundingClientRect();return Math.min(1,Math.max(0,(r.right-ev.clientX)/r.width))};let drag=0;
  sk.addEventListener('pointerdown',ev=>{drag=1;sk.setPointerCapture(ev.pointerId);seekTo(at(ev)*lsn().d)});
  sk.addEventListener('pointermove',ev=>{const f=at(ev),t=f*lsn().d,ch=(CH[S.sid+':'+S.li]||[]).filter(c=>c[0]<=t).pop();const b=$('#bub');b.textContent=fmt(t)+(ch?' · '+ch[1]:'');b.style.insetInlineStart=(f*100)+'%';b.style.left='auto';if(drag)seekTo(t)});
  sk.addEventListener('pointerup',()=>drag=0);
  sk.addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft'){seekTo(S.t+10);ev.preventDefault()}if(ev.key==='ArrowRight'){seekTo(S.t-10);ev.preventDefault()}})}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pick){S.pick=null;render();return}if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.code==='Space'&&!e.target.closest('button,[role=button],[role=option]')){e.preventDefault();setPlaying(!S.playing)}else if(e.key==='n'||e.key==='N')step(1);else if(e.key==='p'||e.key==='P')step(-1);else if(e.key==='j')seekTo(S.t-10);else if(e.key==='l')seekTo(S.t+10)});

const sel=$('#theme');Object.keys(PAL).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent='تم: '+k;sel.appendChild(o)});
sel.addEventListener('change',()=>{S.theme=sel.value;palette()});
const mb=$('#mode');const syncMode=()=>{mb.setAttribute('aria-pressed',S.mode==='dark');mb.textContent=S.mode==='dark'?'حالت تیره: روشن':'حالت تیره'};
mb.addEventListener('click',()=>{S.mode=S.mode==='dark'?'light':'dark';syncMode();palette()});
$('#phone').addEventListener('click',e=>{S.phone=!S.phone;e.currentTarget.setAttribute('aria-pressed',S.phone);$('#frame').classList.toggle('phone',S.phone);app.dataset.pane=S.phone?'list':'main'});
syncMode();palette();render();
</script>

</html>
